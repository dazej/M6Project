# application.properties
spring.application.name=M6Project

# Recreate schema on each run at startup
spring.jpa.hibernate.ddl-auto=create

# Disable Open Session in View
spring.jpa.open-in-view=false

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanager_db
spring.datasource.username=postgres
spring.datasource.password=Mkoijnhy999!

# Ensure data.sql is always executed (even with JPA/Hibernate)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
